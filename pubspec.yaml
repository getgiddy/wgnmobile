name: wgnmobile
description: "WordFeast Gospel Network mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  just_audio: ^0.10.4
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  youtube_player_iframe: ^5.2.1
  dio: ^5.8.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Generates the iOS AppIcon set and the Android mipmaps + adaptive icon from a
# single source image. Run `dart run flutter_launcher_icons` after dropping in
# the artwork. Needs a square, >=1024px master with no fine text — the 176px
# assets/images/wgn-main-logo.png is too small and its ring lettering turns to
# mush at icon sizes. See RELEASE_CHECKLIST.md section C/D.
flutter_launcher_icons:
  image_path: "assets/branding/wgn-icon-1024.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#17101F"
  adaptive_icon_foreground: "assets/branding/wgn-icon-foreground-1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Sora / Newsreader / Space Mono, bundled rather than fetched. These are
    # declared as plain assets, not under `fonts:` — google_fonts resolves them
    # by filename (`<Family>-<Variant>.ttf`) out of the asset manifest and only
    # falls back to the network when a variant is missing, which main.dart now
    # turns into a hard error. If a new weight starts being used, add it to
    # tool/fetch_fonts.py and re-run it.
    - assets/google_fonts/
